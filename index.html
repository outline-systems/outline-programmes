<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outline Programmes</title>
<style>
:root{--bg:#171614;--surface:#1c1b19;--surface2:#242320;--line:#393836;--text:#e5e2dc;--muted:#96938d;--primary:#4f98a3;--danger:#dd6974;--success:#6daa45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}header{display:flex;align-items:center;gap:24px;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--surface)}.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:7px;background:var(--primary);color:#fff}.title{flex:1}.title h1{margin:0;font-size:20px}.title p{margin:3px 0 0;color:var(--muted)}.controls{display:flex;align-items:center;gap:8px}.controls label{color:var(--muted)}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:5px;padding:9px;background:var(--surface2);color:var(--text)}select{width:auto;min-width:180px}.btn{border:1px solid var(--line);border-radius:5px;padding:9px 12px;background:var(--surface2);color:var(--text)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:var(--danger)}.workspace{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 75px)}.sidebar{border-right:1px solid var(--line);background:var(--surface)}.side-head{padding:14px 18px;color:var(--muted);border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase}.phase{border-bottom:1px solid var(--line)}.phase-title{display:flex;gap:8px;align-items:center;padding:12px 16px;font-weight:600}.phase-title button{border:0;background:none;color:var(--muted);padding:0}.task{display:flex;justify-content:space-between;gap:8px;padding:10px 18px 10px 38px;border-top:1px solid #2b2a27;color:var(--muted)}.task:hover{background:var(--surface2);color:var(--text)}.task-actions{display:flex;gap:5px}.icon{border:0;background:none;color:var(--muted);padding:0 3px}.chart{padding:28px;overflow:auto}.empty{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}.empty h2{color:var(--text)}.add-task{margin:8px 16px 14px;width:calc(100% - 32px)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(480px,100%);padding:22px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.dialog h2{margin:0 0 18px}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.error{color:var(--danger);min-height:18px}.notice{position:fixed;right:18px;bottom:18px;background:var(--surface2);border:1px solid var(--line);padding:12px 16px;border-radius:5px;display:none}.notice.show{display:block}@media(max-width:760px){header{align-items:flex-start;flex-wrap:wrap;padding:14px}.title{order:3;flex-basis:100%}.controls{width:100%;flex-wrap:wrap}.controls select{flex:1}.workspace{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.chart{padding:18px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="mark">OP</div>Outline Programmes</div><div class="title"><h1 id="programmeTitle">Programme Planner</h1><p id="programmeSubtitle">Plan your work in phases and tasks</p></div><div class="controls"><label for="programmeSelect">Programme</label><select id="programmeSelect"></select><button class="btn primary" id="newProgramme" type="button">+ New programme</button><button class="btn" id="editProgramme" type="button">Edit</button></div></header>
<main class="workspace"><aside class="sidebar"><div class="side-head">Phase / Task</div><div id="side"></div><button class="btn add-task" id="newTask" type="button">+ Add task</button></aside><section class="chart" id="chart"></section></main>
</div>
<div class="modal" id="modal"><form class="dialog" id="form"><h2 id="formTitle"></h2><div class="form" id="formFields"></div><div class="error" id="formError"></div><div class="dialog-actions"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></form></div>
<div class="notice" id="notice"></div>
<script>
(function(){
'use strict';
var KEY='outline-programmes-data-v2', colors=['#5591c7','#bb653b','#6daa45','#e8af34','#a86fdf','#4f98a3'];
var data=load(), active=0, modalDone=null;
function id(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function today(){var d=new Date();return d.toISOString().slice(0,10)}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){var raw=null;try{raw=localStorage.getItem(KEY)||localStorage.getItem('outline-programmes-data')}catch(e){}if(raw){try{var parsed=JSON.parse(raw);if(Array.isArray(parsed)&&parsed.length)return parsed}catch(e){}}return [{id:id(),name:'My programme',description:'A new programme',phases:[]}]} 
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notice('Safari could not save locally. Check website storage settings.')} }
function current(){return data[active]}
function notice(message){var n=document.getElementById('notice');n.textContent=message;n.className='notice show';setTimeout(function(){n.className='notice'},2600)}
function render(){var p=current();document.getElementById('programmeTitle').textContent=p.name;document.getElementById('programmeSubtitle').textContent=p.description||'Plan your work in phases and tasks';document.getElementById('programmeSelect').innerHTML=data.map(function(x,i){return '<option value="'+i+'">'+esc(x.name)+'</option>'}).join('');document.getElementById('programmeSelect').value=active;var side=document.getElementById('side'), chart=document.getElementById('chart');side.innerHTML='';if(!p.phases.length){side.innerHTML='<div class="empty"><h2>No phases yet</h2><p>Create a task to start your programme.</p></div>';chart.innerHTML='<div class="empty"><h2>Start planning</h2><p>Use “Add task” to create the first phase and task.</p></div>';return}p.phases.forEach(function(ph,pi){var box=document.createElement('div');box.className='phase';box.innerHTML='<div class="phase-title"><button type="button" data-action="toggle" data-phase="'+pi+'">▾</button><span>'+esc(ph.name)+'</span></div>';(ph.tasks||[]).forEach(function(t,ti){var row=document.createElement('div');row.className='task';row.innerHTML='<span>'+esc(t.name)+'</span><span class="task-actions"><button class="icon" type="button" title="Edit" data-action="edit" data-phase="'+pi+'" data-task="'+ti+'">✎</button><button class="icon" type="button" title="Delete" data-action="delete" data-phase="'+pi+'" data-task="'+ti+'">×</button></span>';box.appendChild(row)});side.appendChild(box)});chart.innerHTML='<h2>'+esc(p.name)+'</h2><p>'+esc(p.description||'')+'</p><p>'+p.phases.length+' phase'+(p.phases.length===1?'':'s')+' · '+p.phases.reduce(function(n,x){return n+(x.tasks||[]).length},0)+' tasks</p>'}
function open(title,fields,done){document.getElementById('formTitle').textContent=title;document.getElementById('formError').textContent='';document.getElementById('formFields').innerHTML=fields.map(function(f){return '<label>'+esc(f.label)+'<input name="'+esc(f.name)+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" '+(f.required?'required':'')+'></label>'}).join('');modalDone=done;document.getElementById('modal').className='modal open';var first=document.querySelector('#formFields input');if(first)first.focus()}
function close(){document.getElementById('modal').className='modal';modalDone=null}
document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var values={},els=this.querySelectorAll('input');for(var i=0;i<els.length;i++)values[els[i].name]=els[i].value.trim();if(modalDone)modalDone(values);close()});document.getElementById('cancel').addEventListener('click',close);document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)close()});document.getElementById('programmeSelect').addEventListener('change',function(){active=Number(this.value)||0;render()});document.getElementById('newProgramme').addEventListener('click',function(){open('New programme',[{label:'Name',name:'name',required:true},{label:'Description',name:'description'}],function(v){if(!v.name)return;data.push({id:id(),name:v.name,description:v.description,phases:[]});active=data.length-1;save();render();notice('Programme created')})});document.getElementById('editProgramme').addEventListener('click',function(){var p=current();open('Edit programme',[{label:'Name',name:'name',value:p.name,required:true},{label:'Description',name:'description',value:p.description}],function(v){if(!v.name)return;p.name=v.name;p.description=v.description;save();render();notice('Programme saved')})});document.getElementById('newTask').addEventListener('click',function(){var p=current();open('Add task',[{label:'Phase',name:'phase',value:p.phases.length?'':'Phase 1',required:true},{label:'Task',name:'name',required:true},{label:'Start date',name:'start',type:'date',value:today()}],function(v){if(!v.phase||!v.name)return;var phase=null;for(var i=0;i<p.phases.length;i++)if(p.phases[i].name===v.phase)phase=p.phases[i];if(!phase){phase={id:id(),name:v.phase,tasks:[]};p.phases.push(phase)}phase.tasks.push({id:id(),name:v.name,start:v.start});save();render();notice('Task created')})});document.getElementById('side').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var pi=Number(b.getAttribute('data-phase')),ti=Number(b.getAttribute('data-task')),p=current(),t=p.phases[pi]&&p.phases[pi].tasks[ti];if(b.getAttribute('data-action')==='delete'&&t){p.phases[pi].tasks.splice(ti,1);if(!p.phases[pi].tasks.length)p.phases.splice(pi,1);save();render();notice('Task deleted')}if(b.getAttribute('data-action')==='edit'&&t){open('Edit task',[{label:'Task',name:'name',value:t.name,required:true},{label:'Start date',name:'start',type:'date',value:t.start||today()}],function(v){if(v.name){t.name=v.name;t.start=v.start;save();render();notice('Task saved')}})}});render();
})();
</script>
</body>
</html>
