<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outline Programmes</title>
<style>
:root{--bg:#171614;--surface:#1c1b19;--surface2:#242320;--line:#393836;--text:#e5e2dc;--muted:#96938d;--primary:#4f98a3;--danger:#dd6974;--success:#6daa45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr}header,.controls{background:var(--surface);border-bottom:1px solid var(--line);padding:13px 24px;display:flex;align-items:center;gap:14px}header{position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:700}.mark{width:31px;height:31px;border-radius:7px;background:var(--primary);display:grid;place-items:center;color:#fff;font-size:11px}.title{flex:1;text-align:center}.title h1{margin:0;font-size:17px}.title p{margin:2px 0 0;color:var(--muted);font-size:12px}.btn,input,textarea,select{font:inherit}.btn,select,input,textarea{background:transparent;border:1px solid var(--line);color:inherit;border-radius:6px;padding:7px 10px}.btn{cursor:pointer}.btn:hover{background:var(--surface2)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:var(--danger)}.controls{flex-wrap:wrap;padding:10px 24px}.controls label{color:var(--muted);font-size:12px}.controls select{min-width:210px}.legend{margin-left:auto;display:flex;gap:13px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}.workspace{display:grid;grid-template-columns:290px 1fr;min-height:0}.sidebar,.chart{overflow:auto}.sidebar{background:var(--surface);border-right:1px solid var(--line)}.side-head,.time-head{height:62px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;background:var(--surface);z-index:2}.chart{position:relative}.inner{min-width:1200px}.time-head{display:block;padding:0;position:sticky;top:0;z-index:3}.months,.weeks{height:31px;display:flex}.months{border-bottom:1px solid var(--line)}.months span,.weeks span{flex:0 0 140px;padding:0 12px;border-right:1px solid var(--line);height:100%;display:flex;align-items:center}.weeks span{justify-content:center;color:var(--muted);font:11px monospace}.row{height:34px;border-bottom:1px solid #2a2927;display:flex;align-items:center;position:relative}.phase{height:38px;background:#20211f;font-weight:700}.side-row{padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task{padding-left:31px;color:var(--muted);font-size:12px}.phase .side-row{display:flex;align-items:center;gap:7px}.chevron{color:var(--muted);cursor:pointer}.bar{position:absolute;height:18px;border-radius:5px;top:8px;color:#fff;font-size:11px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 1px 3px #0008}.bar:hover{filter:brightness(1.15)}.grid{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent 139px,#39383655 140px)}.panel{position:fixed;right:0;top:0;bottom:0;width:340px;background:var(--surface);border-left:1px solid var(--line);padding:22px;transform:translateX(100%);transition:.25s;z-index:10;box-shadow:-8px 0 25px #0005;overflow:auto}.panel.open{transform:none}.panel h2{font-size:16px;margin:0 0 5px}.panel p{color:var(--muted);font-size:13px}.close{float:right;border:0;color:var(--muted);font-size:20px;background:none;cursor:pointer}.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}.meta b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.meta span{font-family:monospace}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:20}.modal.open{display:grid}.dialog{width:min(500px,calc(100% - 30px));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 15px 50px #0009}.dialog h2{margin:0 0 18px}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;color:var(--muted);font-size:12px}.form input,.form textarea,.form select{width:100%;background:var(--surface2)}.form textarea{min-height:75px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.light{--bg:#f7f6f2;--surface:#fff;--surface2:#f1f0ec;--line:#d7d4ce;--text:#28251d;--muted:#77736b}.light .phase{background:#f4f2ee}@media(max-width:700px){header,.controls{padding:10px 12px}.title{text-align:left}.title p{display:none}.workspace{grid-template-columns:190px 1fr}.legend{display:none}}
</style></head>
<body><div class="app"><header><div class="brand"><div class="mark">OP</div>Outline Programmes</div><div class="title"><h1 id="programmeTitle">Programme Planner</h1><p id="programmeSubtitle">Plan · Coordinate · Deliver</p></div><button class="btn" id="theme">☼</button></header>
<div class="controls"><label>Programme</label><select id="programmeSelect"></select><button class="btn primary" id="newProgramme">+ New programme</button><button class="btn" id="editProgramme">Edit</button><button class="btn danger" id="deleteProgramme">Delete</button><button class="btn" id="export">Export CSV</button><div class="legend" id="legend"></div></div>
<main class="workspace"><aside class="sidebar"><div class="side-head">Phase / Task</div><div id="side"></div></aside><section class="chart"><div class="inner"><div class="time-head"><div class="months" id="months"></div><div class="weeks" id="weeks"></div></div><div id="rows"></div></div></section></main></div>
<div class="panel" id="panel"><button class="close" id="close">×</button><h2 id="pTitle"></h2><p id="pPhase"></p><div class="meta" id="meta"></div><p id="notes"></p><button class="btn primary" id="editTask">Edit task</button></div>
<div class="modal" id="modal"><form class="dialog" id="form"><h2 id="formTitle"></h2><div class="form" id="formFields"></div><div class="dialog-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save</button></div></form></div>
<script>
const KEY='outline-programmes-data';const colors=['#5591c7','#bb653b','#6daa45','#e8af34','#a86fdf','#4f98a3'];let data=JSON.parse(localStorage.getItem(KEY)||'null');let active=0,expanded=new Set(),selected=null;
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()}function monday(d){d=new Date(d);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)}function addWeeks(s,n){let d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n*7);return d}function fmt(d){return d.toLocaleDateString('en-NZ',{day:'numeric',month:'short'})}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function sample(){let s=monday(new Date());return [{id:uid(),name:'New Programme',client:'',startDate:s,description:'',phases:[{id:uid(),name:'Planning & Mobilisation',color:colors[0],tasks:[{id:uid(),name:'Define programme objectives',week:0,duration:1,notes:''},{id:uid(),name:'Confirm scope and stakeholders',week:1,duration:1,notes:''}]},{id:uid(),name:'Delivery',color:colors[1],tasks:[{id:uid(),name:'Complete primary workstream',week:2,duration:4,notes:''}]},{id:uid(),name:'Quality & Completion',color:colors[2],tasks:[{id:uid(),name:'Complete inspections and handover',week:6,duration:2,notes:''}]}]}]}if(!data){data=sample();save()}expanded=new Set(data[0].phases.map(p=>p.id));
const $=s=>document.querySelector(s),current=()=>data[active];function renderSelect(){$('#programmeSelect').innerHTML=data.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('');$('#programmeSelect').value=active;$('#programmeTitle').textContent=current().name;$('#programmeSubtitle').textContent=(current().client?current().client+' · ':'')+'Plan · Coordinate · Deliver'}function render(){renderSelect();let p=current(),start=new Date(p.startDate+'T00:00:00');$('#weeks').innerHTML='';$('#months').innerHTML='';for(let i=0;i<12;i++){let d=addWeeks(p.startDate,i);$('#weeks').innerHTML+=`<span>${fmt(d)}</span>`;if(i===0||d.getMonth()!==addWeeks(p.startDate,i-1).getMonth())$('#months').innerHTML+=`<span>${d.toLocaleDateString('en-NZ',{month:'long',year:'numeric'})}</span>`}$('#side').innerHTML='';$('#rows').innerHTML='';let idx=0;p.phases.forEach((ph,pi)=>{let open=expanded.has(ph.id);let sr=document.createElement('div');sr.className='row phase';sr.innerHTML=`<div class="side-row"><span class="chevron">${open?'▼':'▶'}</span><i class="dot" style="background:${ph.color}"></i>${ph.name}<button class="btn" style="margin-left:auto;padding:2px 5px" title="Edit phase">⋯</button></div>`;sr.querySelector('.chevron').onclick=()=>{open?expanded.delete(ph.id):expanded.add(ph.id);render()};sr.querySelector('button').onclick=e=>{e.stopPropagation();phaseForm(ph)};$('#side').append(sr);let rr=document.createElement('div');rr.className='row phase';rr.innerHTML=`<div class="grid"></div><div class="bar" style="left:${(ph.tasks[0]?.week||0)*140}px;width:${Math.max(140,(Math.max(...ph.tasks.map(t=>t.week+t.duration),0)-(ph.tasks[0]?.week||0))*140}px);background:${ph.color};opacity:.45">${ph.name}</div>`;$('#rows').append(rr);idx++;if(open)ph.tasks.forEach(t=>{let s=document.createElement('div');s.className='row';s.innerHTML=`<div class="side-row task">${t.name}</div>`;s.onclick=()=>taskPanel(t,ph);$('#side').append(s);let r=document.createElement('div');r.className='row';r.innerHTML=`<div class="grid"></div><div class="bar" style="left:${t.week*140+3}px;width:${Math.max(35,t.duration*140-6)}px;background:${ph.color}">${t.name}</div>`;r.querySelector('.bar').onclick=()=>taskPanel(t,ph);$('#rows').append(r);idx++})});$('#legend').innerHTML=p.phases.map(ph=>`<span><i class="dot" style="background:${ph.color}"></i>${ph.name}</span>`).join('')}
function openModal(title,fields,done){$('#formTitle').textContent=title;$('#formFields').innerHTML=fields.map(f=>`<label>${f.label}<input name="${f.name}" type="${f.type||'text'}" value="${(f.value??'').toString().replaceAll('"','&quot;')}
