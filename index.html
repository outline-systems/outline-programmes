<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outline Programmes</title>
<style>
:root{--bg:#171614;--surface:#1c1b19;--surface2:#242320;--line:#393836;--text:#e5e2dc;--muted:#96938d;--primary:#4f98a3;--accent:#8bc7c1;--danger:#dd6974}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr}header,.controls{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:18px}header{position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}.mark{width:30px;height:30px;border-radius:7px;background:var(--primary);display:grid;place-items:center;color:white;font-weight:800}.title{flex:1;text-align:center}.title h1{margin:0;font-size:17px}.title p{margin:2px 0 0;color:var(--muted);font-size:12px}.btn,select{background:transparent;border:1px solid var(--line);color:inherit;border-radius:6px;padding:7px 10px;cursor:pointer}.btn:hover{background:var(--surface2)}.controls{flex-wrap:wrap;padding:10px 24px}.controls label{color:var(--muted);font-size:12px}.legend{margin-left:auto;display:flex;gap:14px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}.workspace{display:grid;grid-template-columns:290px 1fr;min-height:0}.sidebar,.chart{overflow:auto}.sidebar{background:var(--surface);border-right:1px solid var(--line)}.side-head,.time-head{height:62px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;background:var(--surface);z-index:2}.chart{position:relative}.inner{min-width:1100px}.time-head{display:block;padding:0;position:sticky;top:0;z-index:3}.months,.weeks{height:31px;display:flex}.months{border-bottom:1px solid var(--line);align-items:center}.months span,.weeks span{flex:0 0 140px;padding:0 12px;border-right:1px solid var(--line);height:100%;display:flex;align-items:center}.weeks span{justify-content:center;color:var(--muted);font:11px monospace}.row{height:34px;border-bottom:1px solid #2a2927;display:flex;align-items:center;position:relative}.phase{height:38px;background:#20211f;font-weight:700}.side-row{padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task{padding-left:32px;color:var(--muted);font-size:12px}.phase .side-row{display:flex;align-items:center;gap:8px}.chevron{color:var(--muted);cursor:pointer}.bar{position:absolute;height:18px;border-radius:5px;top:8px;color:#fff;font-size:11px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 1px 3px #0008}.bar:hover{filter:brightness(1.15)}.grid{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent 139px,#39383655 140px)}.today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:1}.panel{position:fixed;right:0;top:0;bottom:0;width:320px;background:var(--surface);border-left:1px solid var(--line);padding:22px;transform:translateX(100%);transition:.25s;z-index:10;box-shadow:-8px 0 25px #0005}.panel.open{transform:none}.panel h2{font-size:16px;margin:0 0 5px}.panel p{color:var(--muted);font-size:13px}.close{float:right;border:0;color:var(--muted);font-size:20px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:25px 0}.meta b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.meta span{font-family:monospace}.light{--bg:#f7f6f2;--surface:#fff;--surface2:#f1f0ec;--line:#d7d4ce;--text:#28251d;--muted:#77736b}.light .phase{background:#f4f2ee}@media(max-width:700px){header,.controls{padding:10px 12px}.title{text-align:left}.title p{display:none}.workspace{grid-template-columns:190px 1fr}.legend{display:none}.brand{font-size:14px}}
</style>
</head>
<body><div class="app">
<header><div class="brand"><div class="mark">OP</div>Outline Programmes</div><div class="title"><h1 id="programmeTitle">Programme Planner</h1><p id="programmeSubtitle">Plan · Coordinate · Deliver</p></div><button class="btn" id="theme">☼</button></header>
<div class="controls"><label>View</label><button class="btn" data-scale="1">Week</button><button class="btn" data-scale="2">2-Week</button><button class="btn" data-scale="4">Month</button><button class="btn" id="today">Today</button><button class="btn" id="export">Export CSV</button><div class="legend" id="legend"></div></div>
<main class="workspace"><aside class="sidebar"><div class="side-head">Phase / Task</div><div id="side"></div></aside><section class="chart"><div class="inner"><div class="time-head"><div class="months" id="months"></div><div class="weeks" id="weeks"></div></div><div id="rows"></div></div></section></main></div>
<div class="panel" id="panel"><button class="close" id="close">×</button><h2 id="pTitle"></h2><p id="pPhase"></p><div class="meta" id="meta"></div><p id="notes"></p></div>
<script>
const phases=[{name:'Planning & Mobilisation',color:'#5591c7',tasks:['Define programme objectives','Confirm scope and stakeholders','Prepare resources and site access','Approve delivery plan']},{name:'Delivery',color:'#bb653b',tasks:['Complete primary workstream','Coordinate suppliers and partners','Review progress against milestones','Manage risks and dependencies']},{name:'Quality & Completion',color:'#6daa45',tasks:['Complete inspections and testing','Resolve defects and actions','Prepare handover information','Close programme and review outcomes']}];
const start=new Date();start.setDate(start.getDate()-((start.getDay()+6)%7));const weeks=12;let scale=1;const expanded=new Set(phases.map((_,i)=>i));
const side=document.querySelector('#side'),rows=document.querySelector('#rows'),weekEl=document.querySelector('#weeks'),monthEl=document.querySelector('#months');
function date(n){let d=new Date(start);d.setDate(d.getDate()+n*7);return d}function fmt(d){return d.toLocaleDateString('en-NZ',{day:'numeric',month:'short'})}
function render(){side.innerHTML='';rows.innerHTML='';weekEl.innerHTML='';monthEl.innerHTML='';for(let i=0;i<weeks;i++){let d=date(i);let w=document.createElement('span');w.textContent=fmt(d);weekEl.append(w);let m=document.createElement('span');m.textContent=d.toLocaleDateString('en-NZ',{month:'long',year:'numeric'});if(i===0||d.getMonth()!==date(i-1).getMonth())monthEl.append(m)}let cursor=0;phases.forEach((p,pi)=>{let open=expanded.has(pi);let sr=document.createElement('div');sr.className='row phase';sr.innerHTML=`<div class="side-row"><span class="chevron">${open?'▼':'▶'}</span><i class="dot" style="background:${p.color}"></i>${p.name}</div>`;sr.onclick=()=>{open?expanded.delete(pi):expanded.add(pi);render()};side.append(sr);let rr=document.createElement('div');rr.className='row phase';rr.innerHTML=`<div class="grid"></div><div class="bar" style="left:${cursor*140}px;width:${p.tasks.length*140}px;background:${p.color};opacity:.45">${p.name}</div>`;rows.append(rr);cursor++;if(open)p.tasks.forEach((t,ti)=>{let s=document.createElement('div');s.className='row';s.innerHTML=`<div class="side-row task">${t}</div>`;s.onclick=()=>openPanel(t,p.name,p.color,pi*4+ti);side.append(s);let r=document.createElement('div');r.className='row';r.innerHTML=`<div class="grid"></div><div class="bar" style="left:${(pi*4+ti)*140}px;width:140px;background:${p.color}">${t}</div>`;rows.append(r);cursor++})});document.querySelector('#legend').innerHTML=phases.map(p=>`<span><i class="dot" style="background:${p.color}"></i>${p.name}</span>`).join('')}
function openPanel(t,p,c,n){document.querySelector('#pTitle').textContent=t;document.querySelector('#pPhase').textContent=p;document.querySelector('#meta').innerHTML=`<div><b>Start</b><span>${fmt(date(n))}</span></div><div><b>Duration</b><span>1 week</span></div><div><b>Status</b><span>Planned</span></div><div><b>Type</b><span>Task</span></div>`;document.querySelector('#notes').textContent='Add programme-specific notes, owners, dates and dependencies to the data in index.html.';document.querySelector('#panel').classList.add('open')}
document.querySelector('#close').onclick=()=>document.querySelector('#panel').classList.remove('open');document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');document.querySelectorAll('[data-scale]').forEach(b=>b.onclick=()=>{scale=+b.dataset.scale;document.querySelector('.inner').style.transform=`scaleX(${scale})`;document.querySelector('.inner').style.transformOrigin='top left'});document.querySelector('#today').onclick=()=>document.querySelector('.chart').scrollTo({left:0,behavior:'smooth'});document.querySelector('#export').onclick=()=>{let csv='Phase,Task\n'+phases.flatMap(p=>p.tasks.map(t=>`"${p.name}","${t}"`)).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='programme.csv';a.click()};render();
</script></body></html>
