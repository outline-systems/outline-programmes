<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equippers Church Hastings — Project Gantt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
  --color-surface-offset:#f3f0ec;--color-surface-dynamic:#e6e4df;
  --color-divider:#dcd9d5;--color-border:#d4d1ca;
  --color-text:#28251d;--color-text-muted:#7a7974;--color-text-faint:#bab9b4;
  --color-primary:#01696f;--color-primary-hover:#0c4e54;
  --color-primary-highlight:#cedcd8;
  --color-warning:#964219;--color-success:#437a22;--color-blue:#006494;
  --color-orange:#da7101;--color-gold:#d19900;--color-purple:#7a39bb;
  --color-error:#a12c7b;--color-notification:#a13544;
  --shadow-sm:0 1px 2px oklch(0.2 0.01 80/0.06);
  --shadow-md:0 4px 12px oklch(0.2 0.01 80/0.08);
  --shadow-lg:0 12px 32px oklch(0.2 0.01 80/0.12);
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
  --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --font-body:'Inter','Helvetica Neue',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"]{
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#1d1c1a;--color-surface-dynamic:#2d2c2a;
  --color-divider:#262523;--color-border:#393836;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;
  --color-primary-highlight:#313b3b;
  --color-warning:#bb653b;--color-success:#6daa45;--color-blue:#5591c7;
  --color-orange:#fdab43;--color-gold:#e8af34;--color-purple:#a86fdf;
  --color-error:#d163a7;--color-notification:#dd6974;
  --shadow-sm:0 1px 2px oklch(0 0 0/.2);
  --shadow-md:0 4px 12px oklch(0 0 0/.3);
  --shadow-lg:0 12px 32px oklch(0 0 0/.4);
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#1d1c1a;--color-surface-dynamic:#2d2c2a;
  --color-divider:#262523;--color-border:#393836;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;--color-primary-highlight:#313b3b;
  --color-warning:#bb653b;--color-success:#6daa45;--color-blue:#5591c7;
  --color-orange:#fdab43;--color-gold:#e8af34;--color-purple:#a86fdf;
  --color-error:#d163a7;--color-notification:#dd6974;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth;}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-sm);color:var(--color-text);background:var(--color-bg);}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;}
/* ─── LAYOUT ─── */
.app{display:grid;grid-template-rows:auto auto 1fr;min-height:100dvh;}
/* ─── HEADER ─── */
header{
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
  padding:var(--space-3) var(--space-6);
  display:flex;align-items:center;gap:var(--space-4);
  position:sticky;top:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:var(--space-2);flex-shrink:0;}
.logo-mark{width:32px;height:32px;}
.logo-text{display:flex;flex-direction:column;line-height:1.1;}
.logo-name{font-size:var(--text-sm);font-weight:700;letter-spacing:-.01em;}
.logo-sub{font-size:var(--text-xs);color:var(--color-text-muted);}
.header-title{flex:1;text-align:center;}
.header-title h1{font-size:var(--text-base);font-weight:600;color:var(--color-text);}
.header-title p{font-size:var(--text-xs);color:var(--color-text-muted);}
.header-actions{display:flex;align-items:center;gap:var(--space-2);flex-shrink:0;}
.btn{
  display:inline-flex;align-items:center;gap:var(--space-2);
  padding:var(--space-2) var(--space-3);
  border-radius:var(--radius-md);font-size:var(--text-xs);font-weight:500;
  transition:background var(--transition),color var(--transition),box-shadow var(--transition);
  white-space:nowrap;
}
.btn-ghost{background:transparent;border:1px solid var(--color-border);color:var(--color-text-muted);}
.btn-ghost:hover{background:var(--color-surface-offset);color:var(--color-text);}
.btn-primary{background:var(--color-primary);color:#fff;}
.btn-primary:hover{background:var(--color-primary-hover);}
/* ─── CONTROLS ─── */
.controls{
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
  padding:var(--space-3) var(--space-6);
  display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap;
}
.control-group{display:flex;align-items:center;gap:var(--space-2);}
.control-label{font-size:var(--text-xs);color:var(--color-text-muted);font-weight:500;}
.zoom-btn{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);border:1px solid var(--color-border);
  font-size:var(--text-sm);color:var(--color-text-muted);
  transition:all var(--transition);
}
.zoom-btn:hover{background:var(--color-surface-offset);color:var(--color-text);}
.zoom-display{
  font-family:var(--font-mono);font-size:var(--text-xs);
  color:var(--color-text-muted);min-width:36px;text-align:center;
}
.today-btn{
  padding:var(--space-1) var(--space-3);border-radius:var(--radius-sm);
  border:1px solid var(--color-border);font-size:var(--text-xs);
  transition:all var(--transition);
}
.today-btn:hover{background:var(--color-primary-highlight);color:var(--color-primary);border-color:var(--color-primary);}
.view-btns{display:flex;border:1px solid var(--color-border);border-radius:var(--radius-sm);overflow:hidden;}
.view-btn{
  padding:var(--space-1) var(--space-3);font-size:var(--text-xs);
  border-right:1px solid var(--color-border);transition:all var(--transition);
}
.view-btn:last-child{border-right:none;}
.view-btn.active{background:var(--color-primary);color:#fff;}
.view-btn:not(.active):hover{background:var(--color-surface-offset);}
.legend{display:flex;align-items:center;gap:var(--space-4);margin-left:auto;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-xs);color:var(--color-text-muted);}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
/* ─── MAIN GANTT AREA ─── */
.gantt-container{display:grid;grid-template-columns:280px 1fr;overflow:hidden;position:relative;}
/* ─── TASK SIDEBAR ─── */
.task-sidebar{
  background:var(--color-surface);border-right:1px solid var(--color-border);
  overflow-y:auto;overflow-x:hidden;
  position:sticky;left:0;z-index:10;
}
.sidebar-header{
  height:64px;display:flex;align-items:center;
  padding:0 var(--space-4);border-bottom:1px solid var(--color-border);
  font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);
  text-transform:uppercase;letter-spacing:.06em;
  position:sticky;top:0;background:var(--color-surface);z-index:5;
}
.phase-row{
  display:flex;align-items:center;padding:0 var(--space-3);height:36px;
  border-bottom:1px solid var(--color-divider);cursor:pointer;
  transition:background var(--transition);
  user-select:none;
}
.phase-row:hover{background:var(--color-surface-offset);}
.phase-expand{
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);margin-right:var(--space-2);flex-shrink:0;
  color:var(--color-text-muted);transition:transform var(--transition);font-size:10px;
}
.phase-expand.open{transform:rotate(90deg);}
.phase-color-dot{width:8px;height:8px;border-radius:2px;margin-right:var(--space-2);flex-shrink:0;}
.phase-name{font-size:var(--text-xs);font-weight:600;color:var(--color-text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.phase-duration{font-size:var(--text-xs);color:var(--color-text-faint);font-family:var(--font-mono);flex-shrink:0;margin-left:var(--space-2);}
.task-row{
  display:flex;align-items:center;padding:0 var(--space-3) 0 var(--space-8);height:28px;
  border-bottom:1px solid oklch(from var(--color-border) l c h/0.4);
  cursor:pointer;transition:background var(--transition);
}
.task-row:hover{background:var(--color-surface-offset);}
.task-row.selected{background:var(--color-primary-highlight);}
.task-name{font-size:var(--text-xs);color:var(--color-text-muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* ─── CHART AREA ─── */
.chart-area{overflow-x:auto;overflow-y:auto;position:relative;}
.chart-inner{position:relative;min-width:100%;}
/* ─── TIME HEADER ─── */
.time-header{
  height:64px;position:sticky;top:0;z-index:10;
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
}
.months-row{
  height:32px;display:flex;align-items:center;
  border-bottom:1px solid var(--color-divider);overflow:hidden;
}
.month-cell{
  height:100%;display:flex;align-items:center;padding:0 var(--space-3);
  font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);
  border-right:1px solid var(--color-divider);white-space:nowrap;flex-shrink:0;
}
.weeks-row{height:32px;display:flex;align-items:center;overflow:hidden;}
.week-cell{
  height:100%;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--color-text-faint);font-family:var(--font-mono);
  border-right:1px solid oklch(from var(--color-border) l c h/0.3);
  flex-shrink:0;
}
.week-cell.today-week{background:oklch(from var(--color-primary) l c h/0.1);color:var(--color-primary);}
/* ─── GANTT ROWS ─── */
.gantt-rows{position:relative;}
.gantt-phase-row{
  height:36px;display:flex;align-items:center;
  border-bottom:1px solid var(--color-divider);position:relative;
  background:oklch(from var(--color-surface-offset) l c h/0.5);
}
.gantt-task-row{
  height:28px;position:relative;
  border-bottom:1px solid oklch(from var(--color-border) l c h/0.4);
  transition:background var(--transition);cursor:pointer;
}
.gantt-task-row:hover{background:oklch(from var(--color-primary) l c h/0.05);}
.gantt-task-row.selected{background:oklch(from var(--color-primary) l c h/0.08);}
/* ─── GRID LINES ─── */
.grid-line{
  position:absolute;top:0;bottom:0;width:1px;
  background:oklch(from var(--color-border) l c h/0.3);pointer-events:none;z-index:0;
}
.grid-line.month-line{background:var(--color-divider);}
.today-line{
  position:absolute;top:0;bottom:0;width:2px;
  background:var(--color-notification);pointer-events:none;z-index:8;
}
.today-label{
  position:absolute;top:0;background:var(--color-notification);
  color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:0 0 3px 3px;
  white-space:nowrap;z-index:8;transform:translateX(-50%);
}
/* ─── BARS ─── */
.phase-bar{
  position:absolute;top:50%;transform:translateY(-50%);
  height:6px;border-radius:3px;opacity:.35;z-index:1;pointer-events:none;
}
.task-bar{
  position:absolute;top:50%;transform:translateY(-50%);
  height:16px;border-radius:var(--radius-sm);z-index:2;
  display:flex;align-items:center;padding:0 var(--space-2);
  font-size:10px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;
  cursor:pointer;transition:opacity var(--transition),filter var(--transition),box-shadow var(--transition);
  box-shadow:0 1px 3px oklch(0 0 0/.3);
}
.task-bar:hover{opacity:.9;box-shadow:0 2px 8px oklch(0 0 0/.4);filter:brightness(1.1);}
.task-bar.selected{box-shadow:0 0 0 2px #fff,0 2px 8px oklch(0 0 0/.4);}
.task-bar-label{overflow:hidden;text-overflow:ellipsis;}
/* ─── MILESTONE ─── */
.milestone{
  position:absolute;top:50%;transform:translateY(-50%) rotate(45deg);
  width:12px;height:12px;border-radius:2px;z-index:3;cursor:pointer;
  box-shadow:0 1px 3px oklch(0 0 0/.3);
}
/* ─── TOOLTIP ─── */
#tooltip{
  position:fixed;z-index:1000;pointer-events:none;
  background:var(--color-surface-2);border:1px solid var(--color-border);
  border-radius:var(--radius-md);padding:var(--space-3);
  box-shadow:var(--shadow-lg);max-width:260px;
  font-size:var(--text-xs);display:none;
}
#tooltip.visible{display:block;}
#tooltip h4{font-size:var(--text-xs);font-weight:600;margin-bottom:var(--space-1);color:var(--color-text);}
#tooltip .tt-phase{font-size:10px;color:var(--color-text-muted);margin-bottom:var(--space-2);}
#tooltip .tt-dates{display:flex;gap:var(--space-3);color:var(--color-text-muted);}
#tooltip .tt-dates span{display:flex;flex-direction:column;gap:2px;}
#tooltip .tt-dates b{font-size:10px;color:var(--color-text-faint);text-transform:uppercase;letter-spacing:.04em;}
/* ─── DETAIL PANEL ─── */
#detail-panel{
  position:fixed;right:0;top:0;bottom:0;width:300px;
  background:var(--color-surface);border-left:1px solid var(--color-border);
  box-shadow:var(--shadow-lg);z-index:200;
  transform:translateX(100%);transition:transform .3s cubic-bezier(0.16,1,0.3,1);
  display:flex;flex-direction:column;
}
#detail-panel.open{transform:translateX(0);}
.panel-header{
  padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--color-border);
  display:flex;align-items:flex-start;gap:var(--space-3);
}
.panel-color{width:12px;height:12px;border-radius:2px;flex-shrink:0;margin-top:2px;}
.panel-header-text{flex:1;}
.panel-header-text h3{font-size:var(--text-sm);font-weight:600;line-height:1.3;}
.panel-header-text p{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px;}
.panel-close{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-sm);color:var(--color-text-muted);transition:all var(--transition);
  flex-shrink:0;
}
.panel-close:hover{background:var(--color-surface-offset);color:var(--color-text);}
.panel-body{flex:1;overflow-y:auto;padding:var(--space-4) var(--space-5);}
.panel-section{margin-bottom:var(--space-5);}
.panel-section-title{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--color-text-faint);margin-bottom:var(--space-3);
}
.panel-meta{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);}
.meta-item label{font-size:10px;color:var(--color-text-faint);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px;}
.meta-item span{font-size:var(--text-xs);color:var(--color-text);font-family:var(--font-mono);}
.progress-bar{height:4px;background:var(--color-surface-dynamic);border-radius:2px;margin-top:var(--space-2);}
.progress-fill{height:100%;border-radius:2px;background:var(--color-primary);transition:width .4s ease;}
/* ─── SCROLL SYNC ─── */
.chart-area::-webkit-scrollbar{height:8px;width:8px;}
.chart-area::-webkit-scrollbar-track{background:var(--color-surface-offset);}
.chart-area::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:4px;}
.chart-area::-webkit-scrollbar-thumb:hover{background:var(--color-text-faint);}
.task-sidebar::-webkit-scrollbar{width:4px;}
.task-sidebar::-webkit-scrollbar-track{background:transparent;}
.task-sidebar::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:2px;}
/* ─── RESPONSIVE ─── */
@media(max-width:768px){
  .gantt-container{grid-template-columns:200px 1fr;}
  header{padding:var(--space-3);}
  .controls{padding:var(--space-3);}
  .legend{display:none;}
}
@media(max-width:480px){
  .gantt-container{grid-template-columns:160px 1fr;}
  .header-title p{display:none;}
  #detail-panel{width:100vw;}
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="logo">
    <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-label="Outline Projects">
      <rect width="32" height="32" rx="6" fill="var(--color-primary)"/>
      <path d="M8 10h11M8 16h8M8 22h13" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 15l3 3-3 3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="logo-text">
      <span class="logo-name">Outline Projects</span>
      <span class="logo-sub">Design · Direct · Deliver</span>
    </div>
  </div>
  <div class="header-title">
    <h1>Equippers Church Hastings</h1>
    <p>Bathroom Refurbishment — Scope of Works</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="export-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export
    </button>
    <button class="btn btn-ghost" data-theme-toggle aria-label="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<div class="controls">
  <div class="control-group">
    <span class="control-label">Zoom</span>
    <button class="zoom-btn" id="zoom-out">−</button>
    <span class="zoom-display" id="zoom-val">W</span>
    <button class="zoom-btn" id="zoom-in">+</button>
  </div>
  <div class="control-group">
    <div class="view-btns">
      <button class="view-btn active" data-view="week">Week</button>
      <button class="view-btn" data-view="fortnight">2-Week</button>
      <button class="view-btn" data-view="month">Month</button>
    </div>
  </div>
  <button class="today-btn" id="today-btn">Jump to Today</button>
  <div class="legend" id="legend"></div>
</div>

<div class="gantt-container" id="gantt-container">
  <div class="task-sidebar" id="task-sidebar">
    <div class="sidebar-header">Task / Phase</div>
    <div id="sidebar-content"></div>
  </div>
  <div class="chart-area" id="chart-area">
    <div class="chart-inner" id="chart-inner">
      <div class="time-header" id="time-header">
        <div class="months-row" id="months-row"></div>
        <div class="weeks-row" id="weeks-row"></div>
      </div>
      <div class="gantt-rows" id="gantt-rows"></div>
    </div>
  </div>
</div>

</div>

<!-- Tooltip -->
<div id="tooltip">
  <h4 id="tt-name"></h4>
  <div class="tt-phase" id="tt-phase"></div>
  <div class="tt-dates">
    <span><b>Start</b><span id="tt-start"></span></span>
    <span><b>End</b><span id="tt-end"></span></span>
    <span><b>Dur.</b><span id="tt-dur"></span></span>
  </div>
</div>

<!-- Detail Panel -->
<div id="detail-panel">
  <div class="panel-header">
    <div class="panel-color" id="panel-color"></div>
    <div class="panel-header-text">
      <h3 id="panel-title"></h3>
      <p id="panel-phase"></p>
    </div>
    <button class="panel-close" id="panel-close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="panel-section">
      <div class="panel-section-title">Schedule</div>
      <div class="panel-meta" id="panel-meta"></div>
    </div>
    <div class="panel-section">
      <div class="panel-section-title">Progress</div>
      <div id="panel-progress-label" style="font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:var(--space-2);"></div>

// ─── STATE ─────────────────────────────────────────────────────────────────
const state = {
  cellWidth: 28,
  view: 'week',
  expandedPhases: new Set(PHASES.map(p=>p.id)),
  selectedTask: null,
  totalDays: 52 * 7,
};

// ─── UTILITIES ─────────────────────────────────────────────────────────────
function addDays(date, days){ const d=new Date(date); d.setDate(d.getDate()+days); return d; }
function formatDate(date){ return date.toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'}); }
function formatShort(date){ return date.toLocaleDateString('en-NZ',{day:'numeric',month:'short'}); }
const TODAY = new Date();
function todayOffset(){
  const diff = (TODAY - PROJECT_START) / (1000*60*60*24);
  return Math.max(0, diff);
}

// WEEK columns (Mon-Sun)
function getWeeks(){
  const weeks = [];
  let d = new Date(PROJECT_START);
  // go to Monday
  const dow = d.getDay(); const adj = dow===0?-6:1-dow;
  d.setDate(d.getDate()+adj);
  while(d < addDays(PROJECT_START, state.totalDays)){
    weeks.push(new Date(d));
    d.setDate(d.getDate()+7);
  }
  return weeks;
}

// ─── RENDER ────────────────────────────────────────────────────────────────
function dayX(day){ return day * state.cellWidth; }
function weekWidth(){ return state.cellWidth * 7; }

function buildLegend(){
  const lg = document.getElementById('legend');
  lg.innerHTML = PHASES.map(p=>`
    <div class="legend-item">
      <div class="legend-dot" style="background:${p.colorHex}"></div>
      <span>${p.name.split('&')[0].replace(/^\d+:/,'').trim().split(' ').slice(0,2).join(' ')}</span>
    </div>
  `).join('');
}

function buildTimeHeader(){
  const weeks = getWeeks();
  const cw = state.cellWidth;

  // months
  const monthsRow = document.getElementById('months-row');
  monthsRow.innerHTML = '';
  let month = -1, monthStart = 0, monthCount = 0;
  weeks.forEach((w,i)=>{
    const m = w.getMonth();
    if(m !== month){
      if(month !== -1){
        const cell = document.createElement('div');
        cell.className = 'month-cell';
        cell.style.width = (monthCount * weekWidth()) + 'px';
        cell.textContent = new Date(w.getFullYear(), month).toLocaleDateString('en-NZ',{month:'long',year:'numeric'});
        monthsRow.appendChild(cell);
      }
      month = m; monthStart = i; monthCount = 0;
    }
    monthCount++;
  });
  if(monthCount>0){
    const cell = document.createElement('div');
    cell.className = 'month-cell';
    cell.style.width = (monthCount * weekWidth()) + 'px';
    cell.textContent = new Date(weeks[weeks.length-1].getFullYear(), month).toLocaleDateString('en-NZ',{month:'long',year:'numeric'});
    monthsRow.appendChild(cell);
  }

  // weeks
  const weeksRow = document.getElementById('weeks-row');
  weeksRow.innerHTML = '';
  const todayOff = todayOffset();
  weeks.forEach(w=>{
    const cell = document.createElement('div');
    cell.className = 'week-cell';
    cell.style.width = weekWidth() + 'px';
    const wOff = (w - PROJECT_START)/(1000*60*60*24);
    const isToday = todayOff >= wOff && todayOff < wOff+7;
    if(isToday) cell.classList.add('today-week');
    cell.textContent = w.toLocaleDateString('en-NZ',{day:'numeric',month:'short'});
    weeksRow.appendChild(cell);
  });

  // total width
  const totalW = weeks.length * weekWidth();
  document.getElementById('chart-inner').style.width = totalW + 'px';
  return {weeks, totalW};
}

function buildRows(totalW){
  const sidebar = document.getElementById('sidebar-content');
  const gantt = document.getElementById('gantt-rows');
  sidebar.innerHTML = '';
  gantt.innerHTML = '';

  const todayOff = todayOffset();

  // today line
  const todayLine = document.createElement('div');
  todayLine.className = 'today-line';
  todayLine.style.left = dayX(todayOff) + 'px';
  const todayLbl = document.createElement('div');
  todayLbl.className = 'today-label';
  todayLbl.style.left = dayX(todayOff) + 'px';
  todayLbl.textContent = 'TODAY';
  gantt.appendChild(todayLine);
  gantt.appendChild(todayLbl);

  PHASES.forEach(phase=>{
    const isOpen = state.expandedPhases.has(phase.id);

    // ── Sidebar phase row ──
    const sPhaseRow = document.createElement('div');
    sPhaseRow.className = 'phase-row';
    sPhaseRow.innerHTML = `
      <div class="phase-expand ${isOpen?'open':''}">▶</div>
      <div class="phase-color-dot" style="background:${phase.colorHex}"></div>
      <span class="phase-name">${phase.name}</span>
      <span class="phase-duration">${phase.duration}w</span>
    `;
    sPhaseRow.addEventListener('click',()=>{
      if(state.expandedPhases.has(phase.id)) state.expandedPhases.delete(phase.id);
      else state.expandedPhases.add(phase.id);
      render();
    });
    sidebar.appendChild(sPhaseRow);

    // ── Gantt phase row ──
    const gPhaseRow = document.createElement('div');
    gPhaseRow.className = 'gantt-phase-row';
    gPhaseRow.style.width = totalW + 'px';
    // phase bar (full span)
    const phaseBar = document.createElement('div');
    phaseBar.className = 'phase-bar';
    phaseBar.style.left = dayX(phase.start * 7) + 'px';
    phaseBar.style.width = dayX(phase.duration * 7) + 'px';
    phaseBar.style.background = phase.colorHex;
    gPhaseRow.appendChild(phaseBar);
    // grid lines
    addGridLines(gPhaseRow, totalW);
    gantt.appendChild(gPhaseRow);

    if(!isOpen) return;

    // ── Tasks ──
    phase.tasks.forEach(task=>{
      const startDay = task.start * 7;
      const durDay = task.duration * 7;
      const endDay = startDay + durDay;
      const taskStart = addDays(PROJECT_START, startDay);
      const taskEnd = addDays(PROJECT_START, endDay - 1);

      // Sidebar task row
      const sTaskRow = document.createElement('div');
      sTaskRow.className = 'task-row' + (state.selectedTask===task.id?' selected':'');
      sTaskRow.innerHTML = `<span class="task-name">${task.name}</span>`;
      sTaskRow.addEventListener('click',()=>selectTask(task, phase));
      sidebar.appendChild(sTaskRow);

      // Gantt task row
      const gTaskRow = document.createElement('div');
      gTaskRow.className = 'gantt-task-row' + (state.selectedTask===task.id?' selected':'');
      gTaskRow.style.width = totalW + 'px';
      addGridLines(gTaskRow, totalW);

      if(task.milestone){
        const ms = document.createElement('div');
        ms.className = 'milestone';
        ms.style.left = (dayX(startDay) + dayX(durDay)/2 - 6) + 'px';
        ms.style.background = phase.colorHex;
        ms.addEventListener('click',()=>selectTask(task, phase));
        gTaskRow.appendChild(ms);
      } else {
        const bar = document.createElement('div');
        bar.className = 'task-bar' + (state.selectedTask===task.id?' selected':'');
        bar.style.left = dayX(startDay) + 4 + 'px';
        bar.style.width = Math.max(dayX(durDay) - 8, 20) + 'px';
        bar.style.background = phase.colorHex;
        bar.innerHTML = `<span class="task-bar-label">${task.name}</span>`;
        bar.addEventListener('mouseenter',(e)=>showTooltip(e, task, phase, taskStart, taskEnd));
        bar.addEventListener('mousemove',(e)=>moveTooltip(e));
        bar.addEventListener('mouseleave',hideTooltip);
        bar.addEventListener('click',()=>selectTask(task, phase));
        gTaskRow.appendChild(bar);
      }

      gantt.appendChild(gTaskRow);
    });
  });
}

function addGridLines(row, totalW){
  const cw = state.cellWidth;
  // month lines every ~4 weeks
  let d = new Date(PROJECT_START);
  let offset = 0;
  while(offset < totalW){
    const gl = document.createElement('div');
    gl.className = 'grid-line' + (offset%(28*cw)===0?' month-line':'');
    gl.style.left = offset + 'px';
    row.appendChild(gl);
    offset += weekWidth();
  }
}

function render(){
  const {weeks, totalW} = buildTimeHeader();
  buildRows(totalW);
  buildLegend();
  updateZoomDisplay();
}

function updateZoomDisplay(){
  const labels = {week:'W', fortnight:'2W', month:'M'};
  document.getElementById('zoom-val').textContent = labels[state.view] || 'W';
}

// ─── TOOLTIP ──────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showTooltip(e, task, phase, start, end){
  document.getElementById('tt-name').textContent = task.name;
  document.getElementById('tt-phase').textContent = phase.name;
  document.getElementById('tt-start').textContent = formatShort(start);
  document.getElementById('tt-end').textContent = formatShort(end);
  document.getElementById('tt-dur').textContent = task.duration + ' wk' + (task.duration!==1?'s':'');
  tooltip.classList.add('visible');
  moveTooltip(e);
}
function moveTooltip(e){
  let x = e.clientX + 16, y = e.clientY + 16;
  if(x + 270 > window.innerWidth) x = e.clientX - 270;
  if(y + 120 > window.innerHeight) y = e.clientY - 120;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip(){ tooltip.classList.remove('visible'); }

// ─── DETAIL PANEL ─────────────────────────────────────────────────────────
function selectTask(task, phase){
  state.selectedTask = task.id;
  const panel = document.getElementById('detail-panel');
  document.getElementById('panel-color').style.background = phase.colorHex;
  document.getElementById('panel-title').textContent = task.name;
  document.getElementById('panel-phase').textContent = phase.name;

  const startDay = task.start * 7;
  const endDay = startDay + task.duration * 7;
  const taskStart = addDays(PROJECT_START, startDay);
  const taskEnd = addDays(PROJECT_START, endDay - 1);
  const todayOff = todayOffset();
  const progress = Math.min(100, Math.max(0, Math.round((todayOff - startDay) / (task.duration*7) * 100)));

  document.getElementById('panel-meta').innerHTML = `
    <div class="meta-item"><label>Start</label><span>${formatShort(taskStart)}</span></div>
    <div class="meta-item"><label>End</label><span>${formatShort(taskEnd)}</span></div>
    <div class="meta-item"><label>Duration</label><span>${task.duration} week${task.duration!==1?'s':''}</span></div>
    <div class="meta-item"><label>Type</label><span>${task.milestone?'Milestone':'Task'}</span></div>
  `;
  document.getElementById('panel-progress-label').textContent = `${progress}% complete (time-based estimate)`;
  document.getElementById('panel-progress-fill').style.width = progress + '%';
  document.getElementById('panel-notes').textContent = task.milestone
    ? 'This is a milestone — a key checkpoint or inspection point in the project.'
    : 'Task is part of ' + phase.name + '. Duration shown in weeks from project start.';

  panel.classList.add('open');
  render();
}

document.getElementById('panel-close').addEventListener('click',()=>{
  state.selectedTask = null;
  document.getElementById('detail-panel').classList.remove('open');
  render();
});

// ─── ZOOM ──────────────────────────────────────────────────────────────────
const ZOOM_STEPS = {
  week: [14, 21, 28, 42, 56],
  fortnight: [7, 10, 14, 20, 28],
  month: [3, 4, 7, 10, 14],
};
let zoomIdx = 2;

document.getElementById('zoom-in').addEventListener('click',()=>{
  const steps = ZOOM_STEPS[state.view];
  zoomIdx = Math.min(zoomIdx+1, steps.length-1);
  state.cellWidth = steps[zoomIdx];
  render();
});
document.getElementById('zoom-out').addEventListener('click',()=>{
  const steps = ZOOM_STEPS[state.view];
  zoomIdx = Math.max(zoomIdx-1, 0);
  state.cellWidth = steps[zoomIdx];
  render();
});

// ─── VIEW SWITCH ───────────────────────────────────────────────────────────
document.querySelectorAll('.view-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.view = btn.dataset.view;
    zoomIdx = 2;
    state.cellWidth = ZOOM_STEPS[state.view][zoomIdx];
    render();
  });
});

// ─── TODAY ─────────────────────────────────────────────────────────────────
document.getElementById('today-btn').addEventListener('click',()=>{
  const x = dayX(todayOffset()) - 200;
  document.getElementById('chart-area').scrollTo({left:Math.max(0,x), behavior:'smooth'});
});

// ─── SCROLL SYNC ──────────────────────────────────────────────────────────
const chartArea = document.getElementById('chart-area');
const sidebar = document.getElementById('task-sidebar');
chartArea.addEventListener('scroll',()=>{
  sidebar.scrollTop = chartArea.scrollTop;
  document.getElementById('time-header').style.transform = `translateY(${chartArea.scrollTop}px)`;
});
sidebar.addEventListener('scroll',()=>{
  chartArea.scrollTop = sidebar.scrollTop;
});

// ─── THEME TOGGLE ──────────────────────────────────────────────────────────
(function(){
  const t=document.querySelector('[data-theme-toggle]'),r=document.documentElement;
  let d=r.getAttribute('data-theme')||'dark';
  r.setAttribute('data-theme',d);
  t&&t.addEventListener('click',()=>{
    d=d==='dark'?'light':'dark';
    r.setAttribute('data-theme',d);
    t.setAttribute('aria-label','Switch to '+(d==='dark'?'light':'dark')+' mode');
    t.innerHTML=d==='dark'?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  });
})();

// ─── EXPORT ────────────────────────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click',()=>{
  const rows = [['Phase','Task','Start Week','Duration (weeks)','Start Date','End Date','Milestone']];
  PHASES.forEach(phase=>{
    phase.tasks.forEach(task=>{
      const startDate = addDays(PROJECT_START, task.start*7);
      const endDate = addDays(PROJECT_START, (task.start+task.duration)*7-1);
      rows.push([
        phase.name, task.name, task.start, task.duration,
        formatDate(startDate), formatDate(endDate), task.milestone?'Yes':'No'
      ]);
    });
  });
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'equippers-church-hastings-gantt.csv';
  a.click();
});
